on:
  push:
    branches:
      - main
    paths-ignore:
      - .editorconfig
      - .gitignore
      - README.md
      - LICENSE.md

jobs:
  build:
    name: Build and upload to container registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@master

      - name: Use Node.js 20.x
        uses: actions/setup-node@master
        with:
          node-version: 20.x

      - name: Cache node_modules
        uses: actions/cache@master
        with:
          path: |
            ~/node_modules
          key: ${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build
        run: npm install && npm run build

      - name: Build container image
        run: bin/build $(echo $GITHUB_SHA | head -c7) .

      - name: Push image to sminn.ee Container Registry
        run: bin/push $(echo $GITHUB_SHA | head -c7)
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  deploy:
    name: Deploy to production
    environment: prod
    runs-on: ubuntu-latest
    needs:
      - build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout main
        uses: actions/checkout@master

      - name: Check Tailscale deploy variables are set
        env:
          TS_DEPLOY_CLIENT_ID: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          TS_DEPLOY_AUDIENCE: ${{ vars.TS_DEPLOY_AUDIENCE }}
        run: |
          # An unset Actions variable expands to an empty string, and neither
          # input is required by the action — without this the deploy fails
          # somewhere inside Tailscale auth instead of naming the cause.
          : "${TS_DEPLOY_CLIENT_ID:?not set — add the Actions variable}"
          : "${TS_DEPLOY_AUDIENCE:?not set — add the Actions variable}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:sminnee-prod-deploy

      - name: Configure kubeconfig over tailnet
        run: tailscale configure kubeconfig tailscale-operator

      - name: Update Kubernetes deployment
        run: bin/deploy $(echo $GITHUB_SHA | head -c7)
