# Authoritative index of sminn.ee's managed secrets.
#
# Every entry here is stored in 1Password (as a Secure Note item whose body
# holds the secret value — preserves newlines) and fanned out to its targets
# by `secretmgr` (https://github.com/sminnee/secretmgr — install with
# `uv tool install git+ssh://git@github.com/sminnee/secretmgr`). The manifest
# defaults to ./secrets.yaml; override with --manifest or SECRETMGR_MANIFEST.
#
# `1password_item:` is optional. If absent, run
# `secretmgr create <codename>` to provision the 1Password item and write its
# UUID back to this file.
#
# Moved here from sminnee/k8s-cluster's monolithic secrets.yaml — the
# 1Password items are unchanged, only the manifest lines moved.

# No secrets for CI deploys.
#
# The public LKE API endpoint is locked down, so CI reaches the cluster over
# the tailnet: the deploy job joins as tag:sminnee-prod-deploy, and the
# operator's API server proxy (auth mode) impersonates it into the Kubernetes
# Group of the same name (RBAC: k8s-cluster repo, sminnee/01-rbac.yaml).
#
# That used to need a stored Tailscale OAuth client secret (codename
# sminnee-prod-deploy, fanned out as the Actions secret TAILSCALE_OAUTH). It
# no longer does: the deploy job authenticates with workload identity
# federation, exchanging a GitHub OIDC token for tailnet access, so there is
# no credential to store or rotate. The two non-secret inputs live as Actions
# *variables* on the repo — TS_DEPLOY_CLIENT_ID and TS_DEPLOY_AUDIENCE — and
# the OAuth client itself is still created by hand in the Tailscale admin
# console (scopes Auth Keys (write) + Devices Core (write), tag
# tag:sminnee-prod-deploy) with the GitHub OIDC trust configured on it.

# No managed secrets. Explicit empty mapping so the manifest still parses as a
# mapping rather than null once every entry is gone.
{}
