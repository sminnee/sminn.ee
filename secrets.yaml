# Authoritative index of sminn.ee's managed secrets.
#
# Every entry here is stored in 1Password (as a Secure Note item whose body
# holds the secret value — preserves newlines) and fanned out to its targets
# by `secretmgr` (https://github.com/sminnee/secretmgr — install with
# `uv tool install git+ssh://git@github.com/sminnee/secretmgr`). The manifest
# defaults to ./secrets.yaml; override with --manifest or SECRETMGR_MANIFEST.
#
# `1password_item:` is optional. If absent, run
# `secretmgr create <codename>` to provision the 1Password item and write its
# UUID back to this file.
#
# Moved here from sminnee/k8s-cluster's monolithic secrets.yaml — the
# 1Password items are unchanged, only the manifest lines moved.

# Tailscale OAuth client for sminn.ee CI deploys. The public LKE API endpoint
# is locked down, so CI reaches the cluster over the tailnet: the deploy job
# joins the tailnet as tag:sminnee-prod-deploy, and the operator's API server
# proxy (auth mode) impersonates it into the Kubernetes Group of the same name
# (RBAC: k8s-cluster repo, sminnee/01-rbac.yaml). The OAuth client is created
# manually in the Tailscale admin console (scopes Auth Keys (write) + Devices
# Core (write), tag tag:sminnee-prod-deploy) — hence no source:/lifetime:
# (hand-curated).
#
# The 1Password Secure Note body holds both fields:
#   client_id: tskey-client-XXXX
#   client_secret: tskey-XXXX
# pushed verbatim as the multiline Actions secret TAILSCALE_OAUTH.
#
# The codename is sminnee-prod-deploy while the repo is sminn.ee — kept
# verbatim from k8s-cluster so the lookup key does not change.
#
# No `env:` on the target: TAILSCALE_OAUTH lives at repo level (verified with
# `gh secret list`), even though the deploy job sets `environment: prod` —
# Actions falls back to the repo-level secret when the environment defines
# none. Do not add `env: prod` without first confirming no environment-scoped
# copy exists (needs a token with Environments: Read-only); a repo-level write
# would be shadowed by an environment secret and rotation would silently
# no-op, leaving the old credential revoked and deploys broken.
#
# TODO: retire this in favour of workload identity federation (no stored
# credential) — same migration the k8s-cluster repo's deploy workflow made.
sminnee-prod-deploy:
  1password_item: ajzw5aqtcijhd6ya7bjye7wxiy
  targets:
    - type: github
      repo: sminnee/sminn.ee
      secret_name: TAILSCALE_OAUTH
